<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式 PCR 模拟器｜可点击版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f7f9fc;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 24px;
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 16px;
        }
        .row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 300px;
        }
        .canvas-box {
            flex: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        svg {
            border: 2px solid #e5e7eb;
            background: #fff;
            border-radius: 12px;
        }
        svg > * {
            pointer-events: fill;
            cursor: pointer;
        }
        svg > *:hover {
            filter: brightness(1.15) drop-shadow(0 0 4px #60a5fa);
        }
        .info-card {
            background: #f0f7ff;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .temp-box {
            background: #fff3e8;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .stat {
            background: #ecfdf5;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .reagent-wrap {
            background: #fef3c7;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .reagent-item {
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .reagent-item:hover {
            background: #fde68a;
        }
        .reagent-item.added {
            background: #bbf7d0;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }
        #nextBtn {
            background-color: #3b82f6;
            color: white;
        }
        #autoBtn {
            background-color: #10b981;
            color: white;
        }
        #resetBtn {
            background-color: #ef4444;
            color: white;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 8px;
        }
        .tip {
            margin-top: 14px;
            font-size: 14px;
            color: #555;
        }
        /* 悬浮提示框 */
        #tooltip {
            position: fixed;
            max-width: 240px;
            padding: 12px;
            background: #222;
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            z-index: 99;
            pointer-events: none;
            display: none;
        }
        .q-mark {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #93c5fd;
            text-align: center;
            line-height: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>交互式 PCR 模拟器｜可点击版</h1>
        <div class="row">
            <!-- 控制面板 -->
            <div class="panel">
                <div class="reagent-wrap">
                    <h3>🧪 添加反应试剂（点我！）</h3>
                    <div class="reagent-item" data-id="template">🧬 模板 DNA</div>
                    <div class="reagent-item" data-id="primer">🔻 引物（正向 + 反向）</div>
                    <div class="reagent-item" data-id="taq">🔥 Taq 聚合酶</div>
                    <div class="reagent-item" data-id="dntp">🧱 dNTP（原料）</div>
                    <div class="reagent-item" data-id="buffer">🧊 缓冲液</div>
                </div>

                <div class="info-card">
                    <h3>当前阶段 <span class="q-mark" data-term="stage">?</span></h3>
                    <p id="stageText">先配齐所有试剂，再开始 PCR！</p >
                </div>

                <div class="temp-box">
                    <h3>🌡 温度 <span class="q-mark" data-term="temp">?</span></h3>
                    <p id="tempText">25 ℃（室温）</p >
                    <input id="tempSlider" type="range" min="20" max="100" value="25">
                </div>

                <div class="stat">
                    <h3>📊 统计</h3>
                    <p>循环次数：<span id="cycle">0</span></p >
                    <p>DNA 分子数：<span id="dnaNum">1</span></p >
                </div>

                <button id="nextBtn" disabled>下一步</button>
                <button id="autoBtn" disabled>自动播放</button>
                <button id="resetBtn">重置</button>
                <p class="tip">💡 玩法提示：点试剂配体系｜拖动滑块控温｜点击画布上的分子查看讲解</p >
            </div>

            <!-- DNA 可视化画布 -->
            <div class="canvas-box">
                <svg width="440" height="340" viewBox="0 0 440 340">
                    <g id="dnaGroup">
                        <path id="strand1" class="mol" data-info="模板 DNA 上链：携带遗传信息的一条多核苷酸链。"
                              stroke="#2563eb" fill="none" stroke-width="6"
                              d="M 80 160 C 140 110, 200 210, 260 160"/>
                        <path id="strand2" class="mol" data-info="模板 DNA 下链：与上链互补配对。"
                              stroke="#db2777" fill="none" stroke-width="6"
                              d="M 80 160 C 140 210, 200 110, 260 160"/>
                        <path id="primer1" class="mol" data-info="引物：短单链 DNA，给聚合酶提供起始位点。"
                              stroke="#22c55e" fill="none" stroke-width="5" d="" opacity="0"/>
                        <path id="primer2" class="mol" data-info="引物：短单链 DNA，给聚合酶提供起始位点。"
                              stroke="#f97316" fill="none" stroke-width="5" d="" opacity="0"/>...
